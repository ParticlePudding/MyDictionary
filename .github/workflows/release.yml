# タグ(v2.00 など)を push すると、Windows でテストとビルドを行い、
# GitHub の Release を作って MyDictionary.exe を添付する。
# Actions の画面から手動で実行した場合は、ビルドした exe を成果物(Artifacts)として残すだけ。
name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test
        run: cargo test --release

      - name: Build
        run: cargo build --release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyDictionary-windows-x64
          path: target/release/MyDictionary.exe
          if-no-files-found: error

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" target/release/MyDictionary.exe \
            --title "MyDictionary ${TAG#v}" \
            --notes-file docs/release-notes.md
