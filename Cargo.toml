[package]
name = "mydictionary"
version = "2.0.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/ParticlePudding/MyDictionary"
description = "MyDictionary - fast personal dictionary (Win32, windows-rs, SQLite)"

# 実行ファイル名は MyDictionary.exe
[[bin]]
name = "MyDictionary"
path = "src/main.rs"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies.windows]
version = "0.58"
features = [
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_Security",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Threading",
  "Win32_UI_Controls",
  "Win32_UI_Controls_Dialogs",
  "Win32_UI_Controls_RichEdit",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
embed-resource = "2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
