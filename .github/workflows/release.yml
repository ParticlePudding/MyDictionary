# Windows でテストとビルドを行い、GitHub の Release を作って MyDictionary.exe を添付する
# (ライセンスの LICENSE と THIRD-PARTY-NOTICES.txt も一緒に添付する)。
#
# 実行のしかた(どちらでもよい):
#   1. Actions の画面で「release」→「Run workflow」を選び、tag に v2.00 のようなタグ名を入れる
#      (タグはこのときに作られる。tag を空にすると、ビルドした exe を Artifacts に残すだけ)
#   2. v2.00 のようなタグを push する
name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "作成するタグ名(例: v2.00)。空なら Release は作らず、exe を Artifacts に残すだけ"
        required: false
        default: ""
      replace:
        description: "同じタグの Release がすでにあれば、作り直す(古い Release とタグを削除してから作成)"
        type: boolean
        required: false
        default: false
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test
        run: cargo test --release

      - name: Build
        run: cargo build --release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyDictionary-windows-x64
          path: |
            target/release/MyDictionary.exe
            LICENSE
            THIRD-PARTY-NOTICES.txt
          if-no-files-found: error

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
          REPLACE: ${{ inputs.replace }}
        run: |
          # 作り直す指定のときは、古い Release とタグを先に削除する
          if [ "$REPLACE" = "true" ] && gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --cleanup-tag --yes
            sleep 5
          fi
          # タグが無ければ、このコミットに作られる
          gh release create "$TAG" target/release/MyDictionary.exe LICENSE THIRD-PARTY-NOTICES.txt \
            --target "$GITHUB_SHA" \
            --title "MyDictionary ${TAG#v}" \
            --notes-file docs/release-notes.md
